name: Repository foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Repository foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check foundation only (not game validation)
        run: node scripts/validate.mjs --repository

  game:
    name: Godot tests and Windows build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned editor and Windows templates
        shell: pwsh
        run: ./scripts/install-godot.ps1 -InstallEditor
      - name: Import project
        run: node scripts/bootstrap.mjs
      - name: Test scenes and startup
        run: node scripts/validate.mjs
      - name: Export and smoke-test Windows executable
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: RogueDeck-windows
          path: artifacts/windows/RogueDeck.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-logs
          path: artifacts/logs/
          if-no-files-found: ignore
